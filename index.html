<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Performance Evaluation - Demo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f5f6fa; color: #222; }
  h1 { font-size: 1.4rem; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { padding: 8px; text-align: left; border-bottom: 1px solid #eee; }
  .note { font-size: .8rem; color: #666; }
</style>
</head>
<body>
<h1>Employee Performance Evaluation System</h1>
<p class="note">Static demo with sample data. The full app is built with Java Spring Boot (see the repository).</p>

<div class="card">
  <strong>Score = 0.30 × Attendance + 0.35 × Productivity + 0.35 × KPI</strong>
</div>

<div class="card"><canvas id="deptChart" height="200"></canvas></div>
<div class="card"><canvas id="trendChart" height="200"></canvas></div>

<div class="card">
  <table id="tbl">
    <thead><tr><th>Employee</th><th>Dept</th><th>Score</th><th>Rating</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script>
const employees = [
  { name: "Aarav Sharma", dept: "Engineering", att: 96, prod: 91, kpi: 94 },
  { name: "Priya Singh", dept: "Engineering", att: 88, prod: 84, kpi: 80 },
  { name: "Rohan Verma", dept: "Sales", att: 92, prod: 78, kpi: 85 },
  { name: "Neha Gupta", dept: "Sales", att: 75, prod: 70, kpi: 68 },
  { name: "Karan Mehta", dept: "HR", att: 98, prod: 90, kpi: 92 },
  { name: "Simran Kaur", dept: "HR", att: 80, prod: 65, kpi: 60 },
  { name: "Aditya Rao", dept: "Finance", att: 90, prod: 88, kpi: 86 },
  { name: "Meera Nair", dept: "Finance", att: 70, prod: 60, kpi: 55 }
];

const score = e => 0.30 * e.att + 0.35 * e.prod + 0.35 * e.kpi;
const rating = s => s >= 90 ? "Outstanding" : s >= 75 ? "Exceeds Expectations" : s >= 60 ? "Meets Expectations" : "Needs Improvement";

// Table
const body = document.querySelector("#tbl tbody");
employees.forEach(e => {
  const s = score(e);
  body.innerHTML += `<tr><td>${e.name}</td><td>${e.dept}</td><td>${s.toFixed(1)}</td><td>${rating(s)}</td></tr>`;
});

// Department averages
const depts = [...new Set(employees.map(e => e.dept))];
const deptAvg = depts.map(d => {
  const list = employees.filter(e => e.dept === d);
  return list.reduce((a, e) => a + score(e), 0) / list.length;
});
new Chart(document.getElementById("deptChart"), {
  type: "bar",
  data: { labels: depts, datasets: [{ label: "Average score by department", data: deptAvg, backgroundColor: "#4f7cff" }] },
  options: { scales: { y: { min: 0, max: 100 } } }
});

// Monthly trend (sample)
new Chart(document.getElementById("trendChart"), {
  type: "line",
  data: {
    labels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun"],
    datasets: [{ label: "Company average score", data: [72, 74, 73, 77, 79, 81], borderColor: "#22a06b", tension: 0.3 }]
  },
  options: { scales: { y: { min: 0, max: 100 } } }
});
</script>
</body>
</html>
